name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Paper-only. The test-suite and the fixture paper cycle must never see live flags.
  TRADING_MODE: paper
  ENABLE_LIVE_TRADING: "false"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dev dependencies from uv.lock
        run: uv sync --extra dev --frozen
      - name: Unit tests (ledger, risk rails, settlement gates, scoreboard)
        run: uv run pytest -q
      - name: One fixture paper cycle emits a ledger-backed scoreboard
        run: |
          uv run python -m apps.paper_loop --once --no-persist --artifact-dir artifacts
          uv run python - <<'EOF'
          import json
          a = json.load(open("artifacts/scoreboard_latest.json"))
          assert a["meta"]["source"] == "measured", a["meta"]
          assert a["meta"]["pnl_source"] == "core.ledger.PaperLedger"
          assert a["portfolio"]["source"] == "ledger_aggregate"
          print("paper_pnl", a["totals"]["paper_pnl"], "fills", a["totals"]["paper_fills"])
          EOF
      - name: News underreaction lane - fixture measurement is runnable and honest
        run: |
          uv run python -m research.news_underreaction --json artifacts/news_underreaction_fixtures.json
          uv run python - <<'EOF'
          import json
          r = json.load(open("artifacts/news_underreaction_fixtures.json"))
          assert r["paper_only"] is True and r["status"] == "fixture_synthetic", r["status"]
          assert r["candidates"] == 8 and r["paper_fills"] == 3, (r["candidates"], r["paper_fills"])
          assert r["literature"]["validated_here"] is False
          assert r["not_validated"], "report must list what is not validated"
          print("news lane ok:", r["refused_by_reason"])
          EOF
      - name: Category specialist lane - fixture scoreboard promotes in-category only and stays underpowered
        run: |
          rm -rf /tmp/specialist
          uv run python -m research.specialist_scoreboard --artifact-dir /tmp/specialist
          uv run python -m research.specialist_scoreboard --artifact-dir /tmp/specialist
          uv run python - <<'EOF'
          import json
          r = json.load(open("/tmp/specialist/specialist_scoreboard_fixtures.json"))
          assert r["kind"] == "specialist_scoreboard" and r["meta"]["source"] == "measured", r["meta"]
          assert r["meta"]["status"] == "fixture_synthetic" and r["meta"]["pnl_source"] == "core.ledger.PaperLedger"
          assert r["preregistration"]["n"] == 30 and r["preregistration"]["wins_required_at_n"] == 20
          promoted = {(s["trader"], s["category"]) for s in r["specialists"]}
          assert promoted == {("fx-macro-alpha", "macro"), ("fx-hoops-delta", "basketball"), ("fx-tennis-zeta", "tennis")}, promoted
          for row in r["scoreboard"]:
              assert row["promoted"] == (not row["reasons"]), row
              assert row["category"] != "other" or not row["promoted"]
          pooled = r["evaluation"]["pooled"]
          assert pooled["status"] == "underpowered" and pooled["n_resolved"] == 3 and pooled["powered"] is False, pooled
          assert r["totals"]["refused_by_reason"]["already_followed"] == 3, r["totals"]
          assert abs(r["ledger"]["realized_pnl"] - 14.3) < 1e-9, r["ledger"]["realized_pnl"]
          assert r["not_validated"], "report must list what is not validated"
          print("specialist lane ok:", pooled["status"], pooled["note"])
          EOF
      - name: Polymarket arb tracks run on fixtures and book the NegRisk conversion
        run: |
          uv run python -m apps.measure_polymarket_arb --no-persist --artifact-dir artifacts
          uv run python - <<'EOF'
          import json
          a = json.load(open("artifacts/scoreboard_polymarket_arb.json"))
          assert a["meta"]["source"] == "measured" and a["meta"]["track_family"] == "polymarket_arb", a["meta"]
          r = json.load(open("artifacts/polymarket_arb_latest.json"))
          assert r["negrisk"]["conversions"][0]["collateral_out"] == 120.0, r["negrisk"]["conversions"]
          assert r["rebalancing"]["mirror_consistent"] == 13, r["rebalancing"]
          print("negrisk conversions", len(r["negrisk"]["conversions"]), "paper_pnl", a["totals"]["paper_pnl"])
          EOF
      - name: Tennis basis track - fixture replay proves the pre-registered math and the settlement filter
        run: |
          uv run python -m apps.measure_tennis_basis --no-persist --artifact-dir artifacts
          uv run python - <<'EOF'
          import json
          a = json.load(open("artifacts/scoreboard_tennis_basis.json"))
          assert a["meta"]["source"] == "measured" and a["meta"]["track_family"] == "tennis_basis", a["meta"]
          assert a["meta"]["pnl_source"] == "core.ledger.PaperLedger"
          r = json.load(open("artifacts/tennis_basis_latest.json"))
          assert r["paper_only"] is True and r["status"] == "fixture_synthetic", r["status"]
          v = r["verdict"]
          assert v["pre_registered"]["min_sample"] == 30 and str(v["pre_registered"]["pass_rate"]) in ("0.6", "0.60")
          assert v["n"] == 2 and v["closed_half"] == 2 and v["status"] == "insufficient_sample", v
          assert v["excluded_settlement_mismatch"] == 2 and v["pending_settlement_check"] == 1, v
          assert r["register"]["closed_at_start"] == 5 and r["register"]["open"] == 0, r["register"]
          for rec in r["records"]:
              assert rec["settlement_basis"]["reason"] == "admitted", rec["record_id"]
              if rec["status"] == "closed_at_start":
                  assert rec["observations"][-1]["pre_start"] is False or rec["observations"][-1]["method"] == "market_missing"
          assert r["not_validated"], "report must list what is not validated"
          print("tennis basis ok:", r["refused_by_reason"], "verdict", v["status"])
          EOF
      - name: Weather dead-bucket track - fixture replay proves the kill rules, the fee math and the kill switch
        run: |
          uv run python -m apps.measure_weather --no-persist --artifact-dir artifacts
          uv run python - <<'EOF'
          import json
          a = json.load(open("artifacts/scoreboard_weather.json"))
          assert a["meta"]["source"] == "measured" and a["meta"]["track_family"] == "weather", a["meta"]
          assert a["meta"]["pnl_source"] == "core.ledger.PaperLedger" and a["meta"]["venues"] == ["polymarket"]
          assert [t["track"] for t in a["tracks"]] == ["weather_dead_bucket"] and a["tracks"][0]["metrics"]["family"] == "weather"
          doc = json.load(open("artifacts/weather_report_fixtures.json"))
          assert doc["kind"] == "weather_report" and doc["paper_only"] is True and doc["meta"]["source"] == "measured", doc["meta"]
          assert doc["status"] == "fixture_synthetic" and doc["totals"]["evaluation_status"] == "underpowered", doc["totals"]
          r = doc["tracks"]["weather_dead_bucket"]
          assert r["candidates"] == 140 and r["paper_fills"] == 32 and r["positions_settled_this_run"] == 32, (r["candidates"], r["paper_fills"])
          v = r["verdict"]
          assert v["pre_registered"]["min_settled_positions"] == 30 and v["pre_registered"]["min_station_days"] == 10
          assert v["n"] == 29 and v["losses"] == 1 and v["kill_rule_triggered"] is True and v["status"] == "INSUFFICIENT_DATA", v
          reasons = r["refused_by_reason"]
          for reason in ("station_unparsed", "station_mismatch", "stale_obs", "too_early_in_day", "not_falling", "bucket_edge_ambiguous", "no_ask", "edge_below_threshold", "insufficient_depth", "market_kind_unsupported", "station_timezone_unknown"):
              assert reasons[reason] >= 1, reason
          rec = {(x["city"], x["bucket_label"]): x for x in r["records"]}
          assert rec[("Buenos Aires", "18-19°C")]["agreement"] == "disagree" and rec[("NYC", "74-75°F")]["rule"] == "certain_yes_day_complete"
          assert r["not_validated"], "report must list what is not validated"
          print("weather dead bucket ok:", reasons, "verdict", v["status"], "kill", v["kill_rule_triggered"])
          EOF
      - name: Fail-closed check - weather measurement refuses live flags
        run: |
          if TRADING_MODE=live ENABLE_LIVE_TRADING=true uv run python -m apps.measure_weather --no-persist --artifact-dir /tmp/weather-should-not-exist; then
            echo "measure_weather started with live flags" && exit 1
          fi
          test ! -e /tmp/weather-should-not-exist/scoreboard_weather.json
      - name: Weather bucket edge - fixture replay proves the pre-registered math, fail-closed parsing and venue settlement
        run: |
          uv run python -m apps.measure_weather_buckets --no-persist --artifact-dir artifacts/weather-ci
          uv run python - <<'EOF'
          import json
          a = json.load(open("artifacts/weather-ci/scoreboard_weather_buckets.json"))
          assert a["meta"]["source"] == "measured" and a["meta"]["track_family"] == "weather", a["meta"]
          assert a["meta"]["pnl_source"] == "core.ledger.PaperLedger" and a["meta"]["venues"] == ["polymarket"]
          r = json.load(open("artifacts/weather-ci/weather_buckets_latest.json"))
          assert r["paper_only"] is True and r["kind"] == "weather_buckets_report" and r["status"] == "fixture_synthetic", r["status"]
          v = r["verdict"]
          assert v["pre_registered"]["min_settled_city_days"] == 30 and str(v["pre_registered"]["pass_net_ev_per_contract"]) in ("0.02", "0.020")
          assert v["n"] == 2 and v["status"] == "insufficient_sample", v
          assert r["verdict_provisional_including_metar"]["n"] == 3
          assert r["station_parse"]["parsed"] == 13 and r["station_parse"]["total"] == 15, r["station_parse"]
          assert r["refused_by_reason"]["no_station"] == 1 and r["refused_by_reason"]["station_ambiguous_across_legs"] == 1
          assert r["metar_venue_agreement"] == {**r["metar_venue_agreement"], "checked": 2, "agree": 1, "disagree": 1}
          assert r["experiment"]["paid_sources"]["enabled"] is False and r["experiment"]["paid_sources"]["implemented"] is False
          for rec in r["records"]:
              for b in rec["buckets"]:
                  if b["fills"]:
                      assert float(b["filled_quantity"]) * float(b["price"]) <= 10.0 + 1e-9, (rec["record_id"], b["label"])
              if rec["status"] == "settled":
                  assert rec["settlement"]["method"] == "venue", rec["record_id"]
          assert r["not_validated"], "report must list what is not validated"
          print("weather buckets ok:", r["refused_by_reason"], "verdict", v["status"])
          EOF
      - name: Fail-closed check - weather bucket-edge measurement refuses live flags
        run: |
          if TRADING_MODE=live ENABLE_LIVE_TRADING=true uv run python -m apps.measure_weather_buckets --no-persist --artifact-dir /tmp/weather-should-not-exist; then
            echo "measure_weather_buckets started with live flags" && exit 1
          fi
          test ! -e /tmp/weather-should-not-exist/scoreboard_weather_buckets.json
      - name: Weather calibration A/B - fixture replay proves the two-lane arithmetic and the pre-registered verdict
        run: |
          uv run python -m apps.measure_weather_calibration --no-persist --artifact-dir artifacts
          uv run python - <<'EOF'
          import json
          a = json.load(open("artifacts/scoreboard_weather_calibration.json"))
          assert a["meta"]["source"] == "measured" and a["meta"]["track_family"] == "weather_calibration", a["meta"]
          assert a["meta"]["pnl_source"] == "core.ledger.PaperLedger"
          assert {t["track"] for t in a["tracks"]} == {"weather_naive_ensemble", "weather_calibrated_ensemble"}
          r = json.load(open("artifacts/weather_calibration_latest.json"))
          assert r["paper_only"] is True and r["status"] == "fixture_synthetic", r["status"]
          assert r["experiment"]["forecasts"]["paid_key_used"] is False
          v = r["verdict"]
          assert v["status"] == "UNDERPOWERED" and v["pre_registered"]["min_settled_per_lane"] == 50, v
          assert v["naive"]["settled"] == 9 and v["calibrated"]["settled"] == 7, v
          assert r["lanes"]["calibrated"]["refused_by_reason"]["calibration_underpowered"] == 11, r["lanes"]["calibrated"]["refused_by_reason"]
          assert r["calibration"]["cities_adequate"] == 2 and r["calibration"]["samples"] == 73, r["calibration"]
          assert r["not_validated"], "report must list what is not validated"
          print("weather calibration ok:", v["status"], v["sample_callout"])
          EOF
      - name: Gate report is emitted and the gated track never ordered on a refused pair
        run: |
          uv run python - <<'EOF'
          import json
          g = json.load(open("artifacts/gate_report_latest.json"))
          assert g["kind"] == "gate_report" and g["meta"]["source"] == "measured", g["meta"]
          assert g["meta"]["policy"]["name"] == "strict"
          t = g["totals"]
          assert t["gate_admitted"] + t["gate_refused"] == t["candidates"], t
          assert t["traded"] <= t["gate_admitted"], t
          for p in g["pairs"]:
              stages_ok = all(c["passed"] for c in p["checks"])
              assert p["admitted"] == stages_ok, p["pair_id"]
              if "edge" in p:
                  assert p["admitted"], f"{p['pair_id']} priced without admission"
              if not p["admitted"]:
                  assert p["reasons"] and p["reason"] == p["reasons"][0], p["pair_id"]
          print("gate", t["gate_admitted"], "/", t["candidates"], "admitted,", t["traded"], "traded;", t["all_stage_reject_reasons"])
          EOF
      - name: Fail-closed check - paper loop refuses live flags
        run: |
          if TRADING_MODE=live ENABLE_LIVE_TRADING=true uv run python -m apps.paper_loop --once --no-persist --artifact-dir /tmp/should-not-exist; then
            echo "paper loop started with live flags" && exit 1
          fi
          test ! -e /tmp/should-not-exist/scoreboard_latest.json
      - name: Kalshi FLB fixture run emits report, scoreboard and run record
        run: |
          uv run python -m apps.measure_flb --no-persist --artifact-dir artifacts/flb-ci
          uv run python - <<'EOF'
          import json, glob
          r = json.load(open("artifacts/flb-ci/flb_report_latest.json"))
          assert r["paper_only"] is True and r["kind"] == "kalshi_flb_report"
          v = {row["check"]: row["verdict"] for row in r["verdict_table"]}
          assert v["flb_identifiable_from_snapshot"] == "NOT_IDENTIFIABLE", v
          assert v["ex_post_flb"] == "PASS", v  # synthetic fixture is built to show FLB
          s = json.load(open("artifacts/flb-ci/scoreboard_flb.json"))
          assert s["meta"]["source"] == "measured" and s["meta"]["kind"] == "kalshi_flb"
          assert [t["track"] for t in s["tracks"]] == ["kalshi_longshot_fade", "kalshi_maker_quote"]
          assert glob.glob("artifacts/flb-ci/paper/runs/*-flb-*.json")
          print(r["headline"])
          EOF
      - name: Fail-closed check - FLB measurement refuses live flags
        run: |
          if TRADING_MODE=live ENABLE_LIVE_TRADING=true uv run python -m apps.measure_flb --no-persist --artifact-dir /tmp/flb-should-not-exist; then
            echo "measure_flb started with live flags" && exit 1
          fi
          test ! -e /tmp/flb-should-not-exist/scoreboard_flb.json
      - name: Tennis whale copy fixture replay emits report, scoreboard, per-lag ledgers and run record
        run: |
          uv run python -m apps.measure_tennis_whale --artifact-dir artifacts/tennis-ci --min-copies 10 --min-markets 5 --resamples 300
          uv run python - <<'EOF'
          import json, glob
          r = json.load(open("artifacts/tennis-ci/tennis_whale_report_latest.json"))
          assert r["paper_only"] is True and r["kind"] == "tennis_whale_copy_report"
          assert r["status"] == "fixture_synthetic" and r["headline"].startswith("Synthetic fixture (not evidence)")
          assert r["pre_registration"]["pass_rule"] and r["pre_registration"]["kill_rule"]
          v = {row["check"]: row["verdict"] for row in r["verdict_table"]}
          assert v["kalshi_whales_identifiable"] == "NOT_IDENTIFIABLE", v
          assert r["whales"]["qualified"] == 2 and r["whales"]["refused_two_sided"] == 1, r["whales"]
          s = json.load(open("artifacts/tennis-ci/scoreboard_tennis_whale.json"))
          assert s["meta"]["source"] == "measured" and s["meta"]["track_family"] == "tennis_copy"
          assert [t["track"] for t in s["tracks"]] == ["tennis_whale_copy_30s", "tennis_whale_copy_2m", "tennis_whale_copy_10m"]
          assert s["totals"]["paper_fills"] == r["copies_total"] > 0
          assert glob.glob("artifacts/tennis-ci/paper/runs/*-tennis-*.json")
          for lag in ("30s", "2m", "10m"):
              assert glob.glob(f"artifacts/tennis-ci/paper/ledger_tennis_whale_copy_{lag}.json")
          print(r["headline"])
          EOF
      - name: Tennis whale copy on network without a harvest is an honest empty
        run: |
          uv run python -m apps.measure_tennis_whale --network --harvest-dir /tmp/no-such-harvest --artifact-dir artifacts/tennis-empty --no-persist
          uv run python - <<'EOF'
          import json
          r = json.load(open("artifacts/tennis-empty/tennis_whale_report_latest.json"))
          assert r["status"] == "no_tennis_markets" and r["overall_verdict"] == "INSUFFICIENT_DATA", (r["status"], r["overall_verdict"])
          s = json.load(open("artifacts/tennis-empty/scoreboard_tennis_whale.json"))
          assert s["totals"]["paper_fills"] == 0 and float(s["totals"]["paper_pnl"]) == 0.0, s["totals"]
          print("honest empty ok:", r["headline"])
          EOF
      - name: Fail-closed check - tennis whale measurement refuses live flags
        run: |
          if TRADING_MODE=live ENABLE_LIVE_TRADING=true uv run python -m apps.measure_tennis_whale --no-persist --artifact-dir /tmp/tennis-should-not-exist; then
            echo "measure_tennis_whale started with live flags" && exit 1
          fi
          test ! -e /tmp/tennis-should-not-exist/scoreboard_tennis_whale.json
      - name: Fade-the-tourist fixture run emits report, scoreboard, ledger and run record
        run: |
          uv run python -m apps.measure_tourist_fade --no-persist --artifact-dir artifacts/tourist-ci
          uv run python - <<'EOF'
          import json, glob
          r = json.load(open("artifacts/tourist-ci/tourist_fade_report_latest.json"))
          assert r["paper_only"] is True and r["kind"] == "fade_the_tourist_report" and r["universe"] == "tennis"
          v = {row["check"]: row["verdict"] for row in r["verdict_table"]}
          # Synthetic fixture: strong regime (favourite >= 70c) passes, pooled result does not, tourists lose.
          assert v["strong_regime_fade_ev_positive"] == "PASS" and v["fade_ev_positive_after_fees"] == "FAIL", v
          assert v["tourist_flow_loses"] == "PASS" and r["ex_post"]["adverse_selection"]["detected"] is False, v
          assert r["adverse_selection_fail_risk"], "report must document the adverse-selection failure mode"
          assert r["live_track"]["paper_fills"] == 2 and r["live_track"]["refused_by_reason"]["one_sided_book"] == 1
          s = json.load(open("artifacts/tourist-ci/scoreboard_tourist_fade.json"))
          assert s["meta"]["source"] == "measured" and s["meta"]["kind"] == "fade_the_tourist" and s["meta"]["track_family"] == "tourist_fade"
          assert s["meta"]["pnl_source"] == "core.ledger.PaperLedger" and [t["track"] for t in s["tracks"]] == ["fade_the_tourist"]
          assert glob.glob("artifacts/tourist-ci/paper/runs/*-tourist-*.json")
          print(r["headline"])
          EOF
      - name: Fail-closed check - fade-the-tourist measurement refuses live flags
        run: |
          if TRADING_MODE=live ENABLE_LIVE_TRADING=true uv run python -m apps.measure_tourist_fade --no-persist --artifact-dir /tmp/tourist-should-not-exist; then
            echo "measure_tourist_fade started with live flags" && exit 1
          fi
          test ! -e /tmp/tourist-should-not-exist/scoreboard_tourist_fade.json

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Experiments index and sync survive unknown track ids
        run: npm test
      - run: npm run build
      - name: Committed experiments index matches the artifacts on disk
        run: |
          git diff --exit-code -- public/artifacts/experiments_index.json \
            || { echo "experiments_index.json is stale: run 'npm run build-experiments-index' and commit"; exit 1; }
          node - <<'EOF'
          const fs = require('node:fs');
          const idx = JSON.parse(fs.readFileSync('public/artifacts/experiments_index.json', 'utf8'));
          const familyIds = new Set((idx.families ?? []).map((f) => f.id));
          for (const run of idx.runs) {
            for (const f of run.artifacts) {
              if (!fs.existsSync(`public/artifacts/${f}`)) throw new Error(`${run.run_id}: missing ${f}`);
            }
            if (run.kind === 'sample' && run.totals.paper_pnl !== null) throw new Error(`${run.run_id}: sample carries PnL`);
            if (run.kind !== 'sample' && !run.pnl_source) throw new Error(`${run.run_id}: measured run without pnl_source`);
            for (const t of run.tracks) {
              if (!familyIds.has(t.family)) throw new Error(`${run.run_id}: track ${t.track} has unregistered family ${t.family}`);
              if (run.kind === 'sample' && t.paper_pnl !== null) throw new Error(`${run.run_id}: sample track ${t.track} carries PnL`);
            }
          }
          for (const lane of idx.lanes ?? []) {
            if (lane.status === 'measured') {
              if (!idx.runs.some((r) => r.run_id === lane.run_id && r.kind !== 'sample')) throw new Error(`lane ${lane.family}: points at a non-measured run`);
            } else if (lane.paper_fills !== null || lane.paper_pnl !== null) {
              throw new Error(`lane ${lane.family}: ${lane.status} lane carries numbers`);
            }
          }
          console.log(`index ok: ${idx.counts.total} runs (${idx.counts.measured} measured, ${idx.counts.sample} sample, ${idx.counts.backtest} backtest); lanes: ${(idx.lanes ?? []).map((l) => `${l.family}=${l.status}`).join(', ')}`);
          EOF
      - name: Committed artifacts are valid and the sample is labelled
        run: |
          node - <<'EOF'
          const fs = require('node:fs');
          for (const f of ['scoreboard_latest.json','scoreboard_network.json','scoreboard_fixtures.json','scoreboard_polymarket_arb.json','scoreboard_flb.json','scoreboard_tennis_whale.json','scoreboard_weather_buckets.json','scoreboard_tourist_fade.json','scoreboard_sample.json','scoreboard_weather_sample.json']) {
            const d = JSON.parse(fs.readFileSync(`public/artifacts/${f}`, 'utf8'));
            if (!d.meta || !Array.isArray(d.tracks) || !d.totals) throw new Error(`${f}: bad shape`);
            const isSample = f.includes('sample');
            if ((d.meta.source === 'sample') !== isSample) throw new Error(`${f}: meta.source=${d.meta.source}`);
            if (!isSample && d.meta.pnl_source !== 'core.ledger.PaperLedger') throw new Error(`${f}: PnL not ledger-backed`);
            console.log(f, d.meta.source, d.meta.mode, 'paper_pnl', d.totals.paper_pnl);
          }
          for (const f of ['gate_report_latest.json','gate_report_network.json','gate_report_fixtures.json']) {
            const d = JSON.parse(fs.readFileSync(`public/artifacts/${f}`, 'utf8'));
            if (d.kind !== 'gate_report' || d.meta.source === 'sample' || !Array.isArray(d.pairs)) throw new Error(`${f}: bad gate report`);
            if (d.totals.traded > d.totals.gate_admitted) throw new Error(`${f}: traded more pairs than the gate admitted`);
            console.log(f, d.meta.mode, `gate ${d.totals.gate_admitted}/${d.totals.candidates} admitted, ${d.totals.traded} traded`);
          }
          const flb = JSON.parse(fs.readFileSync('public/artifacts/flb_report_latest.json', 'utf8'));
          if (flb.kind !== 'kalshi_flb_report' || flb.paper_only !== true) throw new Error('flb_report_latest.json: not a paper-only FLB report');
          const snap = flb.verdict_table.find((r) => r.check === 'flb_identifiable_from_snapshot');
          if (!snap || snap.verdict === 'PASS') throw new Error('FLB report claims FLB is identifiable from a snapshot');
          console.log('flb_report_latest.json', flb.mode, flb.headline);
          const tennis = JSON.parse(fs.readFileSync('public/artifacts/tennis_whale_report_latest.json', 'utf8'));
          if (tennis.kind !== 'tennis_whale_copy_report' || tennis.paper_only !== true) throw new Error('tennis_whale_report_latest.json: not a paper-only tennis whale report');
          if (tennis.status === 'fixture_synthetic' || tennis.mode !== 'network') throw new Error('tennis_whale_report_latest.json: committed report must come from the public tape, not the fixture');
          if (!tennis.pre_registration?.pass_rule || !tennis.pre_registration?.kill_rule) throw new Error('tennis report lacks the pre-registered pass/kill rule');
          const kalshi = tennis.verdict_table.find((r) => r.check === 'kalshi_whales_identifiable');
          if (!kalshi || kalshi.verdict !== 'NOT_IDENTIFIABLE') throw new Error('tennis report claims Kalshi whales are identifiable');
          console.log('tennis_whale_report_latest.json', tennis.mode, tennis.status, tennis.overall_verdict, 'kill:', tennis.kill_rule.status);
          // Weather family (research/weather_tracks.py contract): scoreboard_weather.json + weather_report_<mode>.json.
          const wb = JSON.parse(fs.readFileSync('public/artifacts/scoreboard_weather.json', 'utf8'));
          if (wb.meta.source === 'sample' || wb.meta.track_family !== 'weather' || wb.meta.pnl_source !== 'core.ledger.PaperLedger') throw new Error('scoreboard_weather.json: not a measured, ledger-backed weather board');
          const weather = JSON.parse(fs.readFileSync('public/artifacts/weather_report_latest.json', 'utf8'));
          if (weather.kind !== 'weather_report' || weather.paper_only !== true || weather.meta.source !== 'measured') throw new Error('weather_report_latest.json: not a paper-only measured weather_report');
          if (weather.status === 'fixture_synthetic' || weather.meta.mode !== 'network') throw new Error('weather_report_latest.json: committed report must come from a network cycle, not the fixture');
          const dead = weather.tracks.weather_dead_bucket;
          const wv = dead?.verdict ?? {};
          if (dead && wv.n < dead.experiment.pre_registered.min_settled_positions && ['PASS', 'FAIL'].includes(wv.status)) throw new Error('weather_dead_bucket declared pass/fail below the pre-registered n');
          console.log('weather_report_latest.json', weather.meta.mode, weather.status, Object.keys(weather.tracks).join(','), dead ? `admitted ${dead.admitted}/${dead.candidates} verdict ${wv.status} no_ask ${dead.refused_by_reason?.no_ask ?? 0}` : '');
          const weatherBuckets = JSON.parse(fs.readFileSync('public/artifacts/weather_buckets_latest.json', 'utf8'));
          if (weatherBuckets.kind !== 'weather_buckets_report' || weatherBuckets.paper_only !== true || weatherBuckets.source !== 'measured') throw new Error('weather_buckets_latest.json: not a paper-only measured weather report');
          if (weatherBuckets.status === 'fixture_synthetic' || weatherBuckets.mode !== 'network') throw new Error('weather_buckets_latest.json: committed report must come from the public feeds, not the fixture');
          if (weatherBuckets.verdict.n < weatherBuckets.verdict.pre_registered.min_settled_city_days && ['PASS', 'FAIL'].includes(weatherBuckets.verdict.status)) throw new Error('weather report declared a verdict below the pre-registered n');
          if (weatherBuckets.experiment.paid_sources.enabled !== false) throw new Error('weather report claims a paid source was enabled');
          console.log('weather_buckets_latest.json', weatherBuckets.mode, weatherBuckets.status, `city-days ${weatherBuckets.candidates}, stations parsed ${weatherBuckets.station_parse.parsed}/${weatherBuckets.station_parse.total}, verdict ${weatherBuckets.verdict.status} (n=${weatherBuckets.verdict.n})`);
          for (const f of ['specialist_scoreboard_latest.json','specialist_scoreboard_network.json','specialist_scoreboard_fixtures.json']) {
            const d = JSON.parse(fs.readFileSync(`public/artifacts/${f}`, 'utf8'));
            if (d.kind !== 'specialist_scoreboard' || d.meta.source === 'sample' || !Array.isArray(d.scoreboard)) throw new Error(`${f}: bad specialist board`);
            const pooled = d.evaluation?.pooled ?? {};
            if (pooled.n_resolved < d.preregistration.n && ['pass', 'fail'].includes(pooled.status)) throw new Error(`${f}: declared ${pooled.status} below the pre-registered N`);
            if (d.specialists.some((s) => s.category === 'other' || !s.promoted)) throw new Error(`${f}: promoted an unclassified or non-promoted row`);
            console.log(f, d.meta.mode, `specialists ${d.specialists.length}, follows ${d.totals.follow_log_resolved} resolved / ${d.totals.follow_log_pending} pending, evaluation ${pooled.status}`);
          }
          const tourist = JSON.parse(fs.readFileSync('public/artifacts/tourist_fade_report_latest.json', 'utf8'));
          if (tourist.kind !== 'fade_the_tourist_report' || tourist.paper_only !== true) throw new Error('tourist_fade_report_latest.json: not a paper-only fade-the-tourist report');
          if (!tourist.adverse_selection_fail_risk) throw new Error('tourist_fade_report_latest.json: adverse-selection failure mode not documented');
          if (tourist.mode !== 'network') throw new Error('committed fade-the-tourist report must be a network measurement');
          console.log('tourist_fade_report_latest.json', tourist.mode, tourist.universe, tourist.headline);
